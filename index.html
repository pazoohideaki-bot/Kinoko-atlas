的採集地・土地権利は別確認。","note":"地面を掘る行為は土地所有者の許可なしに行わない。","sources":[["Truffology研究資料","https://jats-truffles.org/wp-content/uploads/truffology/vol_4/T2021-2_Kinoshita%26Sasaki.pdf"]]},{"id":"yamanakako","name":"山中湖村周辺","pref":"山梨県 南都留郡山中湖村","lat":35.4106,"lng":138.8608,"status":"blue","statusLabel":"黒トリュフ類の標本記録","precision":"村域レベル","score":48,"fungi":["Tuber longispinosum系"],"tags":["truffle"],"months":[9,10,11,12],"fee":"—","legal":"分類研究で山中湖村由来標本が検討。採取可能な山林を示す情報ではない。","note":"県有林・国有林・保護地域では別途規制を確認。","sources":[["Truffology研究資料","https://jats-truffles.org/wp-content/uploads/truffology/vol_4/T2021-2_Kinoshita%26Sasaki.pdf"]]},{"id":"shigakogen_no_foraging","name":"志賀高原（蓮池・代表点）","pref":"長野県 下高井郡山ノ内町","lat":36.7196581,"lng":138.4907321,"status":"red","statusLabel":"2026年 一般採取禁止","precision":"ビジターセンター代表点","score":12,"fungi":["天然キノコ全般"],"tags":["mountain"],"months":[8,9,10,11],"fee":"2026年は入山券販売なし","legal":"志賀高原ビジターセンター公式FAQで、2026年のキノコ一般採取は禁止。山菜・タケノコも一般採取全面禁止で、入山券の販売なし。","note":"ピンは志賀高原全域の境界ではなく、蓮池の志賀高原ビジターセンターを代表点として表示。採取地点としては扱わず観察のみ。","sources":[["志賀高原ビジターセンター・FAQ","https://visitor-center.shigakogen.gr.jp/faq/"],["志賀高原ビジターセンター・所在地","https://visitor-center.shigakogen.gr.jp/about/"]]},{"id":"morchella_oshiraji","name":"おしらじの滝付近","pref":"栃木県 矢板市","lat":36.9,"lng":139.8,"status":"blue","statusLabel":"発生記録のみ／採取可否未確認","precision":"論文記載地点（滝周辺・ピンは概略）","score":68,"fungi":["Morchella nipponensis（ニッポンアミガサタケ）"],"tags":["morel"],"months":[5,6],"fee":"—","legal":"2021年5月26日のタイプ標本記録。採取権を示す情報ではない。観瀑台より先は立入禁止のため、規制区域へ入らない。土地所有者・管理者の許可が確認できる範囲以外では採取しない。","note":"標高1025m、ネズコ（Thuja standishii）林下。栃木県では矢板市の野生きのこが出荷制限対象。自家消費は出荷制限とは別だが、最新の放射性物質情報を確認し、可能なら検査してから食べる。アミガサタケ類は生食せず十分に加熱。","sources":[["Mycoscience 2022・標本記録","https://www.jstage.jst.go.jp/article/mycosci/63/6/63_MYC590/_html/-char/en"],["矢板市・おしらじの滝","https://www.city.yaita.tochigi.jp/site/kankou/osirajinotaki.html"],["栃木県・野生きのこ出荷制限","https://www.pref.tochigi.lg.jp/kinkyu/d07/yasei-seigen-jishuku.html"]]},{"id":"morchella_meotobuchi","name":"女夫渕温泉跡付近","pref":"栃木県 日光市川俣","lat":36.8798,"lng":139.4322,"status":"blue","statusLabel":"発生記録のみ／採取可否未確認","precision":"論文記載地点周辺（ピンは女夫渕周辺）","score":67,"fungi":["Morchella nipponensis（ニッポンアミガサタケ）"],"tags":["morel"],"months":[5,6],"fee":"—","legal":"2021年6月6日の標本記録。発生記録は採取許可を意味しない。国有林・私有林・保護区域等の権利関係を現地で確認する。","note":"標高1180m、ネズコ林下。日光市の野生きのこは出荷制限対象。自家消費は別制度だが放射性物質の最新情報を必ず確認。アミガサタケ類は生食不可・十分加熱。","sources":[["Mycoscience 2022・標本記録","https://www.jstage.jst.go.jp/article/mycosci/63/6/63_MYC590/_html/-char/en"],["栃木県・野生きのこ出荷制限","https://www.pref.tochigi.lg.jp/kinkyu/d07/yasei-seigen-jishuku.html"]]},{"id":"morchella_numappara","name":"沼ッ原湿原・深山ダム北方","pref":"栃木県 那須塩原市","lat":37.102,"lng":139.905,"status":"blue","statusLabel":"発生記録のみ／採取可否未確認","precision":"論文記載エリア（深山ダム北方・概略）","score":70,"fungi":["Morchella nipponensis（ニッポンアミガサタケ）"],"tags":["morel"],"months":[5,6],"fee":"—","legal":"2021年6月8日の標本記録。論文は「沼ッ原湿原・深山ダム北方」と記載するが、湿原や管理区域での採取許可を示すものではない。","note":"標高930m、落葉広葉樹下。那須塩原市の野生きのこは出荷制限対象。市は自家消費でも安全確認のため放射性物質検査を行うか、確認できない場合は自家消費を控えるよう案内している。","sources":[["Mycoscience 2022・標本記録","https://www.jstage.jst.go.jp/article/mycosci/63/6/63_MYC590/_html/-char/en"],["那須塩原市・深山湖（ダム）","https://www.city.nasushiobara.tochigi.jp/soshikikarasagasu/tsuishin/6/2/2793.html"],["栃木県・野生きのこ出荷制限","https://www.pref.tochigi.lg.jp/kinkyu/d07/yasei-seigen-jishuku.html"]]},{"id":"morchella_shojinzawa","name":"尚仁沢湧水付近","pref":"栃木県 塩谷町","lat":36.8472,"lng":139.8289,"status":"blue","statusLabel":"発生記録のみ／採取可否未確認","precision":"論文記載地点周辺（ピンは概略）","score":62,"fungi":["Morchella nipponensis（ニッポンアミガサタケ）"],"tags":["morel"],"months":[5,6],"fee":"—","legal":"2021年5月30日の標本記録。観光案内では尚仁沢湧水周辺で植物採取をしないよう明示されており、自然保全上も採取地として扱わず観察候補とする。菌類の採取可否は管理者確認が必要。","note":"標高605m、ネズコ林下。塩谷町の野生きのこは出荷制限対象。自家消費でも最新の放射性物質情報を確認し、十分な加熱を行う。","sources":[["Mycoscience 2022・標本記録","https://www.jstage.jst.go.jp/article/mycosci/63/6/63_MYC590/_html/-char/en"],["とちぎ旅ネット・尚仁沢湧水","https://www.tochigiji.or.jp/spot/s9907"],["栃木県・野生きのこ出荷制限","https://www.pref.tochigi.lg.jp/kinkyu/d07/yasei-seigen-jishuku.html"]]},{"id":"morchella_yagoshima","name":"弥五島付近","pref":"福島県 南会津郡下郷町","lat":37.2744,"lng":139.9017,"status":"blue","statusLabel":"発生記録のみ／採取可否未確認","precision":"弥五島地区レベル（論文標本地は近傍）","score":65,"fungi":["Morchella nipponensis（ニッポンアミガサタケ）"],"tags":["morel"],"months":[5,6],"fee":"—","legal":"2021年6月8日の標本記録。土地の所有・入山権・採取権は未確認のため、発生記録のみとして扱う。","note":"標高650m、竹林下。下郷町では野生きのこはムキタケを除き出荷制限が継続。出荷制限は自家消費採取そのものの禁止とは別だが、福島県は自家消費用の野生きのこも放射能検査を受けられる体制を整備している。","sources":[["Mycoscience 2022・標本記録","https://www.jstage.jst.go.jp/article/mycosci/63/6/63_MYC590/_html/-char/en"],["福島県・南会津郡モニタリング","https://www.pref.fukushima.lg.jp/sec/36250a/monitoring.html"],["福島県・自家消費食品の放射能検査","https://www.pref.fukushima.lg.jp/site/portal/kennai-hoshanoukensa.html"]]},{"id":"takao_tuber_himalayense","name":"高尾山さる園・野草園","pref":"東京都 八王子市高尾町","lat":35.6317,"lng":139.2524,"status":"red","statusLabel":"採取禁止・観察のみ","precision":"施設レベル","score":30,"fungi":["アジアクロセイヨウショウロ（Tuber himalayense）"],"tags":["truffle"],"months":[6,7],"fee":"入園料 大人600円（2026年時点）","legal":"2024年、園内整備中に職員が発見し国立科学博物館が同定・標本収蔵。高尾山は自然保護を優先する区域で、一般の採取地点として扱わない。施設内で無断採取しない。","note":"2024年6月19日公式ブログ記録。地下生菌なので発見には地表の攪乱を伴いやすい。観察・研究記録としてのみ利用。","sources":[["高尾山さる園ブログ・2024年6月19日","https://takao-monkey-park.jp/syblg/archives/2792"],["高尾山さる園・野草園 公式","https://takao-monkey-park.jp/"]]}];
const C={green:'#78e58b',yellow:'#f3c84c',blue:'#69adff',red:'#ff756d'};
const state={filter:'all',q:'',sort:'score',selected:null,user:null,favs:new Set()};
try{state.favs=new Set(JSON.parse(localStorage.getItem('kinokoFav')||'[]'))}catch(e){}
let map=null, markers=new Map(), fallback=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dlat=r(b.lat-a.lat),dlon=r(b.lng-a.lng),x=Math.sin(dlat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function filtered(){const mon=new Date().getMonth()+1;let a=places.filter(p=>{const t=(p.name+' '+p.pref+' '+p.fungi.join(' ')).toLowerCase();if(state.q&&!t.includes(state.q.toLowerCase()))return false;if(state.filter==='collect'&&!['green','yellow'].includes(p.status))return false;if(state.filter==='morel'&&!p.tags.includes('morel'))return false;if(state.filter==='truffle'&&!p.tags.includes('truffle'))return false;if(state.filter==='season'&&!p.months.includes(mon))return false;if(state.filter==='fav'&&!state.favs.has(p.id))return false;return true});a.sort((a,b)=>state.sort==='distance'&&state.user?hav(state.user,a)-hav(state.user,b):b.score-a.score);return a}
function pinIcon(status){return L.divIcon({className:'',html:`<div class="pin ${status}"></div>`,iconSize:[28,28],iconAnchor:[14,27]})}
function initMap(){if(window.L){map=L.map('map',{zoomControl:false,minZoom:5}).setView([36.2,138.6],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);L.control.zoom({position:'topright'}).addTo(map);renderMarkers();return}fallback=true;$('#map').style.display='none';$('#fallback').style.display='block';renderFallback()}
function renderMarkers(){if(!map)return;markers.forEach(m=>m.remove());markers.clear();filtered().forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:pinIcon(p.status),title:p.name}).addTo(map).on('click',()=>openPlace(p.id));markers.set(p.id,m)})}
function renderFallback(){if(!fallback)return;const el=$('#fallback');el.querySelectorAll('.fmark').forEach(x=>x.remove());const a=filtered(),lon0=136.2,lon1=141.9,lat0=33.8,lat1=38.8;a.forEach(p=>{const b=document.createElement('button');b.className='fmark '+p.status;b.title=p.name;b.style.left=((p.lng-lon0)/(lon1-lon0)*86+7)+'%';b.style.top=((lat1-p.lat)/(lat1-lat0)*86+7)+'%';b.onclick=()=>openPlace(p.id);el.appendChild(b)})}
function renderList(){const a=filtered();$('#count').textContent=`${a.length}地点を表示`;$('#list').innerHTML=a.map(p=>`<article class="card ${state.selected===p.id?'sel':''}" data-id="${p.id}"><div class="top"><div><span class="badge ${p.status}">${p.statusLabel}</span><h3>${p.name}</h3><div class="pref">${p.pref}</div></div><button class="fav ${state.favs.has(p.id)?'on':''}" data-fav="${p.id}">★</button></div><div class="fungi">${p.fungi.join('・')}</div><div class="meta"><span>📅 ${p.months.join('・')}月</span><span>💴 ${p.fee}</span>${state.user?`<span>📍 ${hav(state.user,p).toFixed(0)}km</span>`:''}</div></article>`).join('');$$('.card').forEach(c=>c.onclick=e=>{if(!e.target.closest('[data-fav]'))openPlace(c.dataset.id)});$$('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav;state.favs.has(id)?state.favs.delete(id):state.favs.add(id);try{localStorage.setItem('kinokoFav',JSON.stringify([...state.favs]))}catch(e){}renderAll()})}
function renderAll(){renderList();if(map)renderMarkers();if(fallback)renderFallback()}
function openPlace(id){state.selected=id;const p=places.find(x=>x.id===id);if(!p)return;const gm=`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;$('#detailBody').innerHTML=`<span class="badge ${p.status}">${p.statusLabel}</span><h2>${p.name}</h2><div class="sub">${p.pref} · 位置精度：${p.precision}</div><div class="grid"><div class="box"><span>対象</span><b>${p.fungi.join('・')}</b></div><div class="box"><span>主な時期</span><b>${p.months.join('・')}月</b></div><div class="box"><span>料金・許可</span><b>${p.fee}</b></div><div class="box"><span>現在地から</span><b>${state.user?hav(state.user,p).toFixed(0)+' km':'未取得'}</b></div></div><div class="legal">${p.legal}</div><div class="links"><a class="maplink" href="${gm}" target="_blank" rel="noopener">Google Maps ↗</a>${p.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]} ↗</a>`).join('')}</div><div class="note">${p.note}<br>※採取権・入山規則は変更されることがあります。食用は確実に同定できたものに限り、生食を避け、地域の放射性物質情報も確認してください。</div>`;$('#detail').classList.add('open');if(map)map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),11),{duration:.6});renderList()}
$('#close').onclick=()=>{$('#detail').classList.remove('open');state.selected=null;renderList()};$('#q').oninput=e=>{state.q=e.target.value;renderAll()};$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;state.filter=b.dataset.f;$$('.chip').forEach(x=>x.classList.toggle('on',x===b));renderAll()};$('#sort').onclick=()=>{if(state.sort==='score'){if(!state.user)return locate(()=>{state.sort='distance';$('#sort').textContent='現在地から近い順 ↓';renderAll()});state.sort='distance';$('#sort').textContent='現在地から近い順 ↓'}else{state.sort='score';$('#sort').textContent='おすすめ順 ↓'}renderAll()};
function locate(done){if(!navigator.geolocation)return alert('このブラウザでは現在地を取得できません');navigator.geolocation.getCurrentPosition(pos=>{state.user={lat:pos.coords.latitude,lng:pos.coords.longitude};if(map)map.flyTo([state.user.lat,state.user.lng],10);done&&done();renderAll()},()=>alert('現在地の取得が許可されませんでした'),{enableHighAccuracy:false,timeout:7000})}
$('#locate').onclick=()=>locate();$('#fit').onclick=()=>{if(map){const pts=filtered().map(p=>[p.lat,p.lng]);if(pts.length)map.fitBounds(pts,{padding:[40,40]})}};
renderList();initMap();
